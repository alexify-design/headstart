.bob{animation:bob 2.4s ease-in-out infinite}

.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}

// ---------- Real dates + time ----------
const DAY=864e5,DOWS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DOW=DOWS.map(d=>d.slice(0,3)),MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mid=t=>{const x=new Date(t);x.setHours(0,0,0,0);return x.getTime()};
const addDays=(t,n)=>{const x=new Date(t);x.setDate(x.getDate()+n);return x.getTime()};
const today0=()=>mid(Date.now());
const epoch=()=>{if(!S.epoch)S.epoch=today0();return S.epoch};
const dueAt=k=>{const a=ASG[k],x=new Date(addDays(epoch(),a.dueIn));x.setHours(a.dueT[0],a.dueT[1],0,0);return x.getTime()};
const daysTo=t=>Math.round((mid(t)-today0())/DAY);
const left=k=>daysTo(dueAt(k));
const fTime=t=>{const d=new Date(t);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'pm':'am';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap};
const fDate=t=>{const d=new Date(t);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fDay=t=>{const n=daysTo(t);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':fDate(t)};
const fWhen=t=>fDay(t)+', '+fTime(t);
const fLeft=k=>{const n=left(k);return n<0?'overdue':n===0?'due today':n===1?'due tomorrow':'due in '+n+' days'};
const nDays=k=>{const n=left(k);return n<0?'Late':n===0?'Today':n===1?'1 day':n+' days'};
const greet=()=>{const d=new Date(),h=d.getHours();return DOWS[d.getDay()]+' '+(h<5?'night':h<12?'morning':h<17?'afternoon':h<21?'evening':'night')};
const toLocal=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function streak(){const set=new Set(S.log.map(l=>l.d));let t=today0(),n=0;if(!set.has(dayKey(t)))t=addDays(t,-1);while(set.has(dayKey(t))){n++;t=addDays(t,-1)}return n}
const lvl=()=>1+Math.floor(S.xp/100);
const weekMin=()=>S.log.filter(l=>l.t>Date.now()-7*DAY).reduce((a,l)=>a+l.min,0);

// ---------- Scheduler: puts steps into real free evenings before the deadline ----------
function autoSchedule(k,steps){
  const due=dueAt(k),n=steps.length,nowT=Date.now();
  const slot=day=>{const x=new Date(day),w=x.getDay();x.setHours(w===0||w===6?11:19,0,0,0);return x.getTime()};
  let start=today0();if(slot(start)<nowT+20*60e3)start=addDays(start,1);
  const safety=daysTo(due)>=3?1:0;const end=addDays(mid(due),-1-safety);
  const days=[];for(let d=start;d<=end;d=addDays(d,1))days.push(d);
  let soon=null;if(!days.length){const r=Math.ceil((nowT+15*60e3)/(5*60e3))*5*60e3;soon=r}
  const per=Math.max(1,Math.ceil(n/Math.max(1,days.length))),groups=Math.ceil(n/per),gap=days.length/groups;
  const out=[];let cur=null,curDay=-1;
  steps.forEach((s,i)=>{const g=Math.floor(i/per),di=Math.min(days.length-1,Math.floor(g*gap));
    if(soon){cur=cur?cur:soon}else if(di!==curDay){curDay=di;cur=slot(days[di])}
    out.push({t:s[0],m:s[1],at:cur,done:false});cur=cur+(s[1]+10)*60e3});
  return out;
}
const safetyDay=k=>daysTo(dueAt(k))>=3?addDays(mid(dueAt(k)),-1):null;
function questsFor(k){const a=ASG[k];return a.quests.map((q,i)=>S.tiny[k+i]?[q[0]+' (10-min version)',10]:[q[0],q[1]])}
function buildDraft(k,src){
  if(src==='own'){const own=(S.own[k]||[]).filter(x=>x[0].trim());const auto=autoSchedule(k,own.map(x=>[x[0].trim(),x[1]]));S.draft[k]=auto.map((s,i)=>own[i][2]?{...s,at:own[i][2]}:s)}
  else S.draft[k]=autoSchedule(k,questsFor(k));
  S.draft[k].sort((a,b)=>a.at-b.at);
}
const nextStep=k=>{const sc=S.sched[k]||[];const i=sc.findIndex(s=>!s.done);return i<0?null:{k,i,s:sc[i]}};
function upNext(list){let best=null;list.forEach(k=>{if(!S.planned[k]||S.submitted[k])return;const n=nextStep(k);if(n&&(!best||n.s.at<best.s.at))best=n});return best}

const ACT={
 back:()=>{goBack();return false},
 persona:a=>{S.persona=a},
 color:c=>{S.buddy=c},glasses:()=>{S.glasses=!S.glasses},
 app:a=>{S.apps[a]=!S.apps[a]},
 skipReveal:()=>{go('pick',true);return false},
 pick:i=>{S.pick=+i},
 planPick:()=>{S.assign=ALEX_LIST[S.pick];S.qsel=0;go('assignment');return false},
 openAssign:k=>{S.assign=k;S.qsel=0;S.how=S.useOwn[k]?'own':S.remind[k]?'remind':'suggest';go('assignment');return false},
 openQuests:k=>{S.assign=k;go('quests');return false},
 openPlan:k=>{S.assign=k;S.draft[k]=(S.sched[k]||[]).map(x=>({...x}));go('plan');return false},
 openCheck:k=>{S.assign=k;go('check');return false},
 openDone:k=>{S.assign=k;go('submitted');return false},
 startStep:v=>{const [k,i]=v.split(':');S.assign=k;unlockAudio();newTimer('focus',k,+i,true);go('focus');return false},
 freeFocus:()=>{newTimer('focus',null,0,false);go('focus');return false},
 bell:k=>{S.remind[k]=!S.remind[k]},
 time:k=>{S.timePick=k},
 how:k=>{S.how=k},
 ownAdd:()=>{S.own[S.assign].push(['',25,null])},
 ownDel:i=>{S.own[S.assign].splice(+i,1);if(!S.own[S.assign].length)S.own[S.assign].push(['',25,null])},
 ownMin:v=>{const [i,n]=v.split(':');S.own[S.assign][+i][1]=+n},
 ownAuto:i=>{S.own[S.assign][+i][2]=null},
 ownPlan:()=>{const list=S.own[S.assign].filter(x=>x[0].trim());if(!list.length){const f=document.getElementById('own-0');if(f){f.focus();f.placeholder='Write at least one step'}return false}S.useOwn[S.assign]=1;buildDraft(S.assign,'own');go('plan');return false},
 planSuggest:()=>{S.useOwn[S.assign]=0;buildDraft(S.assign,'suggest');go('plan');return false},
 qsel:i=>{S.qsel=+i},
 shrink:i=>{S.tiny[S.assign+i]=!S.tiny[S.assign+i]},
 cal:()=>{S.cal=!S.cal},
 lockIn:()=>{const k=S.assign,first=!S.planned[k];S.sched[k]=(S.draft[k]||[]).map(x=>({...x})).sort((a,b)=>a.at-b.at);S.planned[k]=1;delete S.remind[k];delete S.draft[k];
  if(isPloy()){go('g-home');return false}go(first?'nudge':'home');return false},
 replan:()=>{const k=S.assign;delete S.draft[k];delete S.sched[k];S.planned[k]=0;go('assignment',true);return false},
 ropt:k=>{S.remindOpts[k]=!S.remindOpts[k]},
 remindDone:()=>{S.remind[S.assign]=1;go(isPloy()?'g-home':'home');return false},
 snooze:()=>{S.snooze=!S.snooze},
 skipStep:()=>{const k=S.assign,due=dueAt(k);(S.sched[k]||[]).forEach(x=>{if(!x.done){const n=addDays(x.at,1);if(n<due-2*36e5)x.at=n}});go('behind');return false},
 pauseFocus:()=>{const t=S.t;if(!t)return;if(t.endAt)tmHold(t);else tmRun(t)},
 tmStart:()=>{unlockAudio();tmRun(S.t)},
 tmGo:()=>{tmApply();return false},
 tmMore:s=>{const t=S.t;t.modal=null;t.phase='focus';t.left=+s;t.seg=+s;t.auto=10;tmRun(t)},
 tmSkipBreak:()=>{S.t.modal='toFocus';tmApply();return false},
 tmBreakMore:()=>{const t=S.t;t.modal=null;t.phase='break';t.left=120;t.auto=10;tmRun(t)},
 tmEndBreak:()=>{const t=S.t;t.endAt=null;t.left=0;t.modal='toFocus';t.auto=10;alarm()},
 tmDemo:()=>{const t=S.t;if(t.endAt)t.endAt=Date.now()+3000;else{t.left=3;tmRun(t)}},
 tmClose:()=>{const t=S.t;if(t&&!t.started)S.t=null;go(t&&t.kind==='sprint'?'g-rescue':'home');return false},
 questDone:()=>{const t=S.t;if(!t){go('home');return false}
  const cur=t.phase==='focus'&&t.started&&!t.modal?t.seg-tLeft(t):0,spent=Math.max(1,Math.round((t.focusSec+cur)/60)),xp=Math.max(10,Math.round(spent*.9)),before=lvl();
  if(t.k&&S.sched[t.k]&&S.sched[t.k][t.i]){S.sched[t.k][t.i].done=true;S.sched[t.k][t.i].doneAt=Date.now()}
  S.xp+=xp;S.log.push({t:Date.now(),d:dayKey(Date.now()),min:spent,k:t.k||(t.kind==='sprint'?'essay':null)});
  S.last={k:t.k,i:t.i,min:spent,xp,up:lvl()>before};const kind=t.kind;S.t=null;S.mood=null;go(kind==='sprint'?'g-made':'done');return false},
 handIn:()=>{S.submitted[S.assign]=Date.now();go('submitted');return false},
 laptopTip:()=>{S.laptop=!S.laptop},
 pass:()=>{S.pass=true},
 mood:m=>{S.mood=m},
 check:i=>{S.checks[S.assign+i]=!S.checks[S.assign+i]},
 meTab:t=>{S.meTab=t},cls:c=>{S.clsFilter=c},
 switchPloy:()=>{S.persona='ploy';S.t=null;go('g-home');return false},
 switchAlex:()=>{S.persona='alex';S.t=null;go('home');return false},
 gOpen:()=>{S.gStep=1},gPick:()=>{S.gStep=2},gClose:()=>{S.gStep=0},
 gAllow:()=>{S.gStep=0;if(restoreAcct('ploy')){go('g-home');return false}S.persona='ploy';go('g-add');return false},
 signIn:who=>{if(restoreAcct(who)){go('home');return false}S.persona=who;go('found');return false},
 logoutAsk:()=>{S.logoutSheet=true},logoutCancel:()=>{S.logoutSheet=false},
 logout:()=>{S.logoutSheet=false;S.t=null;try{localStorage.setItem('hsAcct_'+S.persona,JSON.stringify(S));localStorage.removeItem(SAVE)}catch(e){}try{history.replaceState(null,'','#welcome')}catch(e){}location.reload();return false},
 snap:()=>{S.snapped=true},addOne:()=>{S.addStep=Math.min(3,S.addStep+1)},
 ployBuddy:n=>{S.ployBuddy=n},ployApp:a=>{S.ployApps[a]=!S.ployApps[a]},
 style:k=>{S.style=k},
 styleGo:()=>{if(S.style==='remind')go('g-cal');else{S.assign='essay';S.qsel=0;go('assignment')}return false},
 tinyCal:()=>{S.tinyCal=!S.tinyCal},nope:()=>{S.offer=false},
 tinyPick:i=>{S.tinyPick=+i},lock:()=>{S.lock=!S.lock},
 reset:()=>{try{localStorage.removeItem(SAVE);localStorage.removeItem('hsAcct_alex');localStorage.removeItem('hsAcct_ploy')}catch(e){}try{history.replaceState(null,'','#welcome')}catch(e){}location.reload();return false},
 feel:f=>{S.feel=f},next:i=>{S.next=+i},sticker:i=>{S.stickerSel=+i}
};
function restoreAcct(who){let a=null;try{a=JSON.parse(localStorage.getItem('hsAcct_'+who)||'null')}catch(e){}if(!a)return false;Object.assign(S,a);S.persona=who;S.logoutSheet=false;S.welcomeBack=true;try{localStorage.removeItem('hsAcct_'+who)}catch(e){}return true}
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}}

// ---------- Shell ----------
function shell(v){
 const alex=[['home','home','Home'],['classes','classes','Classes'],['focus','focus','Focus'],['me','me','Me']];
 const ploy=[['g-home','home','Home'],['focus','focus','Focus'],['g-me','me','Me']];
 const items=v.app==='ploy'?ploy:alex, tabKey=v.tab;
 const isOn=(r)=>(r==='home'||r==='g-home')?tabKey==='home':r.endsWith(tabKey)&&tabKey!=='home';
 const who=v.app==='ploy'?'Ploy · Google':'Alex · Teams';
 return `<div class="shell"><aside class="side" aria-label="Main">
  <div class="row" style="margin-bottom:18px">${v.app==='ploy'?buddy('#5FD4A0',40):buddy(S.buddy,40,{glasses:S.glasses})}<div><div style="font-family:var(--display);font-weight:800;font-size:20px">HeadStart</div><div style="font-size:12px;color:var(--muted)">${who}</div></div></div>
  ${items.map(([r,i,l])=>`<a href="#${r}" class="nav ${isOn(r)?'on':''}" data-go="${r}">${I(i,20)}${l}</a>`).join('')}
  <div style="margin-top:auto" class="stack-s"><span class="label">Demo</span><button class="btn line sm" style="width:100%" data-act="${v.app==='ploy'?'switchAlex':'switchPloy'}">See ${v.app==='ploy'?"Alex's":"Ploy's"} version</button><button class="btn ghost" style="min-height:40px" data-act="logoutAsk">Log out</button></div>
 </aside><main class="main scroller"><div class="content view-in">${v.html}</div></main>
 <nav class="tabs" aria-label="Tabs">${items.map(([r,i,l])=>`<a href="#${r}" class="tab ${isOn(r)?'on':''}" data-go="${r}">${I(i,24)}${l}</a>`).join('')}</nav>${logoutSheet()}</div>`;
}
function full(v){return `<div class="full scroller t-${v.tone}"><div class="full-in view-in">${v.html}</div></div>`}

// ---------- Router ----------
const SAVE='hsSave3';
const app=document.getElementById('app');
function fitHeight(){const vv=window.visualViewport;let h=Math.max(window.innerHeight||0,document.documentElement.clientHeight||0,vv?Math.round(vv.height):0);try{const sa=navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;const portrait=(window.innerHeight||0)>=(window.innerWidth||0);if(sa&&screen&&screen.height){const sh=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);if(sh>h)h=sh}}catch(e){}document.documentElement.style.setProperty('--app-h',h+'px');try{window.scrollTo(0,0)}catch(e){}}
fitHeight();window.addEventListener('resize',fitHeight);window.addEventListener('pageshow',fitHeight);window.addEventListener('load',()=>{fitHeight();setTimeout(fitHeight,300)});if(window.visualViewport)visualViewport.addEventListener('resize',fitHeight);window.addEventListener('orientationchange',()=>setTimeout(fitHeight,350));
let io=null;
function enhance(){
 const sc=app.querySelector('.scroller');if(!sc)return;
 const box=sc.querySelector(':scope > .content, :scope > .full-in');
 let hdr=null;if(box){const f=box.firstElementChild;if(f&&(box.classList.contains('content')||(f.classList.contains('row')&&f.querySelector('button'))))hdr=f}
 if(hdr){hdr.classList.add('hdr');box.classList.add('has-hdr')}
 const onScroll=()=>{if(hdr)hdr.style.setProperty('--s',Math.min(1,sc.scrollTop/56).toFixed(3))};sc.addEventListener('scroll',onScroll,{passive:true});onScroll();
 if(io)io.disconnect();
 if('IntersectionObserver' in window){const h=sc.clientHeight;io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:sc,threshold:.08});
  sc.querySelectorAll('.card,.dash,.qnode').forEach(el=>{if(el.closest('.hdr,.sheet,.cta-bar,.bottom'))return;const r=el.getBoundingClientRect(),top=r.top-sc.getBoundingClientRect().top;if(top>h-10){el.classList.add('rv');io.observe(el)}})}
}
function render(entering){
 const sc0=app.querySelector('.scroller'),keep=entering?0:(sc0?sc0.scrollTop:0);
 const fn=V[route]||V.welcome; if(route.startsWith('g-'))S.persona='ploy';
 const v=fn();
 app.innerHTML=v.app?shell(v):full(v);
 document.title='HeadStart';
 document.body.dataset.tone=v.app?'app':v.tone;
 const sc=app.querySelector('.scroller');if(sc&&keep)sc.scrollTop=keep;
 enhance();
 try{localStorage.setItem(SAVE,JSON.stringify({S:S,route:route,stack:stack.slice(-30)}))}catch(e){}
 if(v.enter)v.enter();
}
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function setRoute(r){
 clearTimers();
 if(r===route){render(false);return}
 if(route==='home'&&r!=='home')S.welcomeBack=false;
 route=r;S.laptop=false;S.gStep=0;
 try{if(location.hash!=='#'+r)history.replaceState(null,'','#'+r)}catch(e){}
 render(true);
}
function go(r,replace){if(isPloy()){if(r==='home')r='g-home';if(r==='me')r='g-me'}if(!replace&&route!==r)stack.push(route);setRoute(r)}
function goBack(){const r=stack.pop();setRoute(r||(isPloy()?'g-home':'welcome'))}
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(V[r]&&r!==route){if(stack[stack.length-1]===r)stack.pop();else stack.push(route);setRoute(r)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){fitHeight();clearTimers();render(false)}});

app.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-go]'); if(!t||!app.contains(t))return;
 if(t.tagName==='A')e.preventDefault();
 if(e.target.closest('.sheet')&&t.classList.contains('scrim'))return;
 let handled=false;
 if(t.dataset.act&&ACT[t.dataset.act]){const res=ACT[t.dataset.act](t.dataset.arg);if(res===false)handled=true}
 if(!handled&&t.dataset.go){go(t.dataset.go);return}
 if(!handled){clearTimers();render(false)}
});
app.addEventListener('pointerdown',e=>{if(e.target.closest('[data-act],[data-go],button,a')){try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}}},true);
app.addEventListener('input',e=>{const d=e.target.dataset||{};if(d.own!==undefined&&S.own[S.assign])S.own[S.assign][+d.own][0]=e.target.value;if(d.bname!==undefined)S.buddyName=e.target.value.trim()||'Mochi';try{localStorage.setItem(SAVE,JSON.stringify({S:S,route:route,stack:stack.slice(-30)}))}catch(_){}});
app.addEventListener('change',e=>{const d=e.target.dataset||{},v=e.target.value;if(d.ownat===undefined&&d.at===undefined)return;if(!v)return;let ts=new Date(v).getTime();if(isNaN(ts))return;const due=dueAt(S.assign);if(ts>due)ts=due-60*60e3;
 if(d.ownat!==undefined)S.own[S.assign][+d.ownat][2]=ts;else if(S.draft[S.assign]){S.draft[S.assign][+d.at].at=ts;S.draft[S.assign].sort((a,b)=>a.at-b.at)}
 clearTimers();render(false)});
const tg=document.getElementById('viewToggle');
function paintToggle(){const on=document.body.classList.contains('phone-mode');tg.innerHTML=on?I('laptop',18)+' Laptop view':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3"/><path d="M11 18h2"/></svg> Phone view';tg.setAttribute('aria-pressed',on)}
try{if(localStorage.getItem('hsPhone')==='1')document.body.classList.add('phone-mode')}catch(e){}
tg.addEventListener('click',()=>{document.body.classList.toggle('phone-mode');try{localStorage.setItem('hsPhone',document.body.classList.contains('phone-mode')?'1':'0')}catch(e){}paintToggle();clearTimers();render(false)});
paintToggle();
let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE)||'null')}catch(e){}
if(saved&&saved.S){Object.assign(S,saved.S);S.gStep=0;S.laptop=false;stack=Array.isArray(saved.stack)?saved.stack:[]}
epoch();
const start=location.hash.slice(1)||(saved&&saved.route)||'';
route=V[start]?start:'welcome';
if(route.startsWith('g-'))S.persona='ploy';
render(true);
})();
</script>
